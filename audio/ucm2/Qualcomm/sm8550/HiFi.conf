SectionVerb {
	EnableSequence [
		cset "name='PRIMARY_MI2S_RX Audio Mixer MultiMedia1' 1,1"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1,1"
	]

	DisableSequence [
		cset "name='PRIMARY_MI2S_RX Audio Mixer MultiMedia1' 0,0"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 0,0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Stereo Speakers"

	EnableSequence [
		cset "name='PRIMARY_MI2S_RX Audio Mixer MultiMedia1' 1,1"
		cset "name='BottomAmp SPK Active' 1,1"
		cset "name='BottomAmp SPK Mute' 0,0"
		cset "name='BottomAmp SPK Gain' 4,4"
	]

	DisableSequence [
		cset "name='BottomAmp SPK Mute' 1,1"
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Mic" {
	Comment "Internal Stereo Microphones"

	EnableSequence [
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1,1"
		cset "name='TX DEC0 MUX' MSM_DMIC"
		cset "name='TX DEC1 MUX' MSM_DMIC"
		cset "name='TX DMIC MUX0' DMIC1"
		cset "name='TX DMIC MUX1' DMIC3"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_AIF1_CAP Mixer DEC1' 1"
		cset "name='TX_DEC0 Volume' 90"
		cset "name='TX_DEC1 Volume' 90"
	]

	DisableSequence [
		cset "name='TX DMIC MUX0' ZERO"
		cset "name='TX DMIC MUX1' ZERO"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX_AIF1_CAP Mixer DEC1' 0"
	]

	Value {
		CaptureChannels 2
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
	}
}
