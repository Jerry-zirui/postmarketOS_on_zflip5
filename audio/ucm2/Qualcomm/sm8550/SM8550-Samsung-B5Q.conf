Syntax 4

SectionUseCase."HiFi" {
	File "/Qualcomm/sm8550/HiFi.conf"
	Comment "HiFi quality Music."
}

BootSequence [
	cset "name='stream0.vol_ctrl0 MultiMedia1 Playback Volu' 8192"
	cset "name='BottomAmp SPK Profile' 0"
	cset "name='BottomAmp SPK Gain' 4,4"
	cset "name='BottomAmp SPK Mute' 0,0"
	cset "name='BottomAmp SPK Active' 1,1"
	cset "name='TX_DEC0 Volume' 90"
	cset "name='TX_DEC1 Volume' 90"
]

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
